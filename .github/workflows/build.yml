name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '1'
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Install dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -buildvcs=true -o landrun ./cmd/landrun

      - name: Verify static binary
        run: |
          binary_info="$(file ./landrun)"
          echo "$binary_info"
          grep -q "statically linked" <<<"$binary_info"

      - name: Record Landlock ABI and effective policy
        run: |
          ./landrun --probe-json
          policy_output="$(./landrun --log-level debug --best-effort --rox ./landrun -- ./landrun --probe 2>&1)"
          echo "$policy_output"
          grep -Fq 'Effective Landlock policy: {"applied":true' <<<"$policy_output"
          grep -Eq '"kernel_abi":[1-9][0-9]*' <<<"$policy_output"
          grep -Fq '"handled_network_rights":["bind_tcp","connect_tcp"]' <<<"$policy_output"

      - name: Run offline integration tests against artifact
        run: ./test.sh --no-build --keep-binary --offline

      - name: Generate checksum
        run: sha256sum landrun > landrun.sha256

      - name: Record and verify artifact provenance
        run: |
          version_output="$(./landrun --version)"
          go_version="$(go env GOVERSION)"
          echo "$version_output"
          go version -m ./landrun | tee landrun.buildinfo
          grep -Fq "$GITHUB_SHA" <<<"$version_output"
          grep -Fq "$go_version" <<<"$version_output"
          grep -Fq "vcs.revision=$GITHUB_SHA" landrun.buildinfo
          grep -Fq "vcs.modified=false" landrun.buildinfo
          grep -Fq "$go_version" landrun.buildinfo

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: landrun-linux-${{ matrix.arch }}
          path: |
            ./landrun
            ./landrun.sha256
            ./landrun.buildinfo
          if-no-files-found: error
          retention-days: 14
