name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout signed tag
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: "0"
          persist-credentials: false

      - name: Fetch main branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # actions/checkout resolves the tag to GITHUB_SHA and writes that commit
      # into refs/tags/<tag>, leaving a lightweight tag. The gate requires the
      # annotated tag object to check its signature, so fetch the real one.
      - name: Restore the annotated tag object
        run: |
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag

      - name: Verify release tag
        run: ./ci/verify-release-tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Verify release tag protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/verify-release-rulesets.sh

      - name: Verify required main checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/verify-release-checks.sh "$GITHUB_SHA"

  build:
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout signed tag
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: "0"
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "stable"

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Build and verify static binary
        env:
          CGO_ENABLED: "0"
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          expected_version="${GITHUB_REF_NAME#v}"
          go_version="$(go env GOVERSION)"
          go build -trimpath -buildvcs=true -o landrun ./cmd/landrun
          binary_info="$(file ./landrun)"
          version_output="$(./landrun --version)"
          echo "$binary_info"
          echo "$version_output"
          grep -q "statically linked" <<<"$binary_info"
          grep -Fq "landrun version ${expected_version} (" <<<"$version_output"
          grep -Fq "$GITHUB_SHA" <<<"$version_output"
          grep -Fq "$go_version" <<<"$version_output"
          mkdir dist
          go version -m ./landrun | tee "dist/landrun-linux-${TARGET_ARCH}.buildinfo"
          grep -Fq "vcs.revision=$GITHUB_SHA" "dist/landrun-linux-${TARGET_ARCH}.buildinfo"
          grep -Fq "vcs.modified=false" "dist/landrun-linux-${TARGET_ARCH}.buildinfo"

      - name: Run offline integration tests
        run: ./test.sh --no-build --keep-binary --offline

      - name: Package binary
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: mv landrun "dist/landrun-linux-${TARGET_ARCH}"

      - name: Upload release input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout signed tag
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: "0"
          persist-credentials: false

      - name: Download tested binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: dist/landrun.spdx.json
          syft-version: v1.51.1
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Generate release checksums
        run: |
          cd dist
          checksum_file="$(mktemp)"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
            sort -z |
            xargs -0 sha256sum > "$checksum_file"
          mv "$checksum_file" SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest release provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/landrun-linux-*
            dist/landrun.spdx.json
            dist/SHA256SUMS

      - name: Attest release SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/landrun-linux-amd64
            dist/landrun-linux-arm64
          sbom-path: dist/landrun.spdx.json

      - name: Preserve attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" dist/landrun.provenance.sigstore.jsonl
          cp "$SBOM_BUNDLE" dist/landrun.sbom.sigstore.jsonl

      - name: Publish release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; refusing to replace published assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
